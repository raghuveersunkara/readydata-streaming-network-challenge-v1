# Candidate-owned Compose overlay. Add solution services and overrides here.
# Paths are relative to the repository root because this file is always used
# as an overlay after the root docker-compose.yml.

x-solution-common: &solution-common
  build:
    context: ./solution/ingestion
    dockerfile: Dockerfile
  environment: &solution-env
    NESSIE_URI: http://nessie:19120/iceberg
    S3_ENDPOINT: http://garage:3900
    S3_REGION: "${S3_REGION:-garage}"
    AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}"
    AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    CONTRACTS_DIR: /app/contracts/events
    REFERENCE_DATA_DIR: /app/reference-data
  volumes:
    - ./contracts/events:/app/contracts/events:ro
    - ./reference-data:/app/reference-data:ro
  networks:
    - challenge

services:
  # Override: cap Trino's heap at 2 GB. The supplied jvm.config uses
  # MaxRAMPercentage=80, i.e. ~6 GB of an 8 GB Docker VM that the rest of the
  # stack already uses ~4 GB of, so heavy queries got Trino killed by the VM's
  # OOM killer. Identical to the supplied file except -Xms1G/-Xmx2G.
  trino:
    volumes:
      - ./solution/trino/jvm.config:/etc/trino/jvm.config:ro

  # Long-running Kafka -> Iceberg consumer for the five event topics.
  ingestion:
    <<: *solution-common
    container_name: solution-ingestion
    restart: unless-stopped
    # Docker's default is 10 s before SIGKILL. Give the final write + offset commit
    # on shutdown time to finish, so a routine stop doesn't cause a replay.
    stop_grace_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      # The supplied kafka-init creates the five topics after Kafka is healthy.
      # Without this, ingestion can subscribe first and miss a topic on a fresh start.
      kafka-init:
        condition: service_completed_successfully
      nessie:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      <<: *solution-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BATCH_SIZE: "500"
      FLUSH_INTERVAL_SEC: "5.0"

  # One-shot: validate the reference CSVs and publish the four reference tables.
  # Idempotent; re-run with `docker compose ... run --rm reference-loader`.
  # restart "no": a validation failure must stay visible, not loop.
  reference-loader:
    <<: *solution-common
    command: ["python", "-u", "load_reference.py"]
    restart: "no"
    depends_on:
      nessie:
        condition: service_healthy
      garage:
        condition: service_healthy

  # On-demand Trino query client (python `trino` package). The "tools" profile
  # keeps it out of `up`; run it with `docker compose ... run --rm query`.
  query:
    build:
      context: ./solution/query
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: solution
    volumes:
      - ./solution/sql:/sql:ro
    networks:
      - challenge
